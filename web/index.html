  <meta charset="UTF-8">

  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="CashFlow AI - Your Personal AI Treasury">
  <meta name="google-signin-client_id" content="156847763373-2sctp4embn1odn68kpo5dcss39hnk0mj.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="CashFlow AI">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    @media print {
      @page {
        size: auto;
        margin: 5mm;
      }
      html, body {
        width: 100vw !important;
        height: auto !important;
        overflow: visible !important;
        background: #0F172A !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      flutter-view {
        width: 100% !important;
        height: auto !important;
        max-width: 100% !important;
      }
      * {
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body>
  <script>
    // Force purge stale Service Workers and browser CacheStorage
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    // Native Web Speech Recognition Bridge
    window.activeSpeechRecognition = null;
    window.initiateSpeechRecognition = function(lang, onResult, onError, onEnd) {
      try {
        if (window.activeSpeechRecognition) {
          try { window.activeSpeechRecognition.abort(); } catch(e) {}
          window.activeSpeechRecognition = null;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError('unsupported');
          return;
        }

        const rec = new SpeechRec();
        window.activeSpeechRecognition = rec;
        rec.lang = lang || 'en-SG';
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        let gotResult = false;

        rec.onresult = function(e) {
          try {
            if (e.results && e.results.length > 0) {
              const res = e.results[e.results.length - 1];
              if (res && res.length > 0) {
                const transcript = res[0].transcript;
                if (transcript && transcript.trim().length > 0) {
                  gotResult = true;
                  if (onResult) onResult(transcript.trim());
                }
              }
            }
          } catch(err) {
            console.error('Speech onresult error:', err);
          }
        };

        rec.onerror = function(e) {
          console.warn('Speech recognition error:', e.error);
          if (onError) onError(e.error || 'error');
        };

        rec.onend = function() {
          window.activeSpeechRecognition = null;
          if (onEnd) onEnd(gotResult);
        };

        rec.start();
      } catch(err) {
        console.error('Speech start exception:', err);
        if (onError) onError(err.toString());
      }
    };

    // Mobile Screenshot & Window Focus / WebGL Context Recovery
    function resetFlutterGlassPanePointers() {
      try {
        const glassPanes = document.querySelectorAll('flt-glass-pane, flutter-view, canvas');
        glassPanes.forEach(function(el) {
          try {
            el.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, cancelable: true }));
            el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true }));
          } catch(e) {}
        });
      } catch(e) {}
    }

    window.addEventListener('blur', function() {
      resetFlutterGlassPanePointers();
    });

    window.addEventListener('focus', function() {
      resetFlutterGlassPanePointers();
      window.dispatchEvent(new Event('resize'));
    });

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        resetFlutterGlassPanePointers();
        window.dispatchEvent(new Event('resize'));
      }
    });

    // Auto-restore WebGL Context if lost during hardware screen capture
    window.addEventListener('webglcontextlost', function(e) {
      console.warn('WebGL context lost during screen capture, attempting restore...');
      e.preventDefault();
      setTimeout(function() {
        window.dispatchEvent(new Event('resize'));
      }, 300);
    }, false);

    window.addEventListener('webglcontextrestored', function(e) {
      console.log('WebGL context restored.');
      window.dispatchEvent(new Event('resize'));
    }, false);
  </script>
  <script src="flutter_bootstrap.js?v=20260831_robust_json_fallback_v7" async></script>
</body>
</html>
