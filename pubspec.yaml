name: cashflow_ai
description: CashFlow AI - Your Personal AI Treasury
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local database (Drift ORM over SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # HTTP client
  dio: ^5.4.3+1

  # Auth - Google Sign-In
  google_sign_in: ^6.2.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Biometrics
  local_auth: ^2.2.0

  # File handling
  file_picker: ^8.0.7
  path_provider: ^2.1.3
  path: ^1.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # AI generative model SDK
  google_generative_ai: ^0.4.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  collection: ^1.18.0
  shared_preferences: ^2.2.3

  # Image
  cached_network_image: ^3.3.1

  # UI extras
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
